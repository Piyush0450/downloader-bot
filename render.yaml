services:
  - type: web
    name: productivity-hub-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python setup_webhook.py && gunicorn bot:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    plan: standard
    disk:
      name: db-volume
      mountPath: /app/database
      sizeGB: 1
    healthCheckPath: /health
    envVars:
      - key: BOT_MODE
        value: webhook
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: WEBHOOK_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO
