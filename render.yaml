services:
  - type: web
    name: productivity-hub-bot
    runtime: docker
    plan: standard
    disk:
      name: db-volume
      mountPath: /app/database
      sizeGB: 1
    healthCheckPath: /health
    envVars:
      - key: BOT_MODE
        value: webhook
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: WEBHOOK_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO
